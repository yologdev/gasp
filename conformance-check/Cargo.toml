[package]
name = "conformance-check"
version = "0.1.0"
edition = "2021"
description = "GASP conformance checker — verifies an agent repo against Part VI of the spec"
license = "MIT"

[dependencies]
yoagent-state = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
