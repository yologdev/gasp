name: ci
on:
  push:
  pull_request:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check 4 walks history
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo run -q -- fixture --fixture

  viewer:
    # site-yoyo/tests cover the activity feed's labelling and run grouping. They
    # ran nowhere until now, so a regression in the public log's presentation
    # would only have shown up on the deployed page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test site-yoyo/tests/*.test.cjs
